# git-cliff configuration for ThunderCode.
#
# There is no CHANGELOG.md. The changelog is the body of the GitHub release,
# generated from Conventional Commit subjects at publish time, so the only
# place a release is described is the page people actually read.
#
# That means this config only ever renders one release: the commits since the
# last tag. It is always invoked with `--strip all`, so a header and footer
# would be dead weight and there are none.

[changelog]
body = """{% for group, commits in commits | group_by(attribute="group") %}### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}"""

trim = true

[git]
conventional_commits = true

# Anything that is not a Conventional Commit is dropped rather than guessed at.
# Merge commits are the bulk of what this removes; a subject with no type is
# the other case, and it is meant to be noticed in review, not silently listed.
filter_unconventional = true
filter_commits = true

protect_breaking_commits = true
split_commits = false
topo_order = false
sort_commits = "oldest"

# Bare versions, no `v` prefix: the tag is the value of `manifest.json`'s
# `version` field and nothing else, because the release workflow compares the
# two literally.
#
# Anchored, and a regex rather than a glob. `[0-9]*` looks like the same thing
# and is not: as a regex it matches the empty string, so it matches every tag
# in the repository, and any stray tag then outranks the real ones.
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"

commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  # Internal-only types. They are required on the commit and absent from the
  # release notes: someone reading them wants to know what the add-on now
  # does, not how the repo is maintained.
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
]
