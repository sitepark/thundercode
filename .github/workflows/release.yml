# Publishes a release. Run it by hand from the Actions tab; there is no
# automatic trigger.
#
# The bump chosen at dispatch is what this release raises: `main` sits on the
# last released version, and the workflow raises it, commits that, tags the
# commit and publishes it. So the tag always names a commit where the manifest
# agreed with it, and the choice is made in front of the commits that actually
# landed rather than predicted at the end of the previous release.
#
# Why the tag is created by the release rather than pushed first: a tag pushed
# with the default GITHUB_TOKEN does not trigger workflows, so a `on: push:
# tags:` job would never fire. Creating the tag as part of publishing avoids
# needing a personal access token to work around that.
#
# The release must not be a draft or a prerelease. `update_url` resolves
# through `releases/latest`, which skips both - either one would publish the
# archive while leaving every installed copy pointed at the previous version.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part this release raises"
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

permissions:
  contents: write

# Two of these at once would race on the push to main and could publish two
# releases from the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the guards below ask git which versions have
      # been released, which a shallow clone cannot answer.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refuse to release from anywhere but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from main, got '$GITHUB_REF'" >&2
            exit 1
          fi

      # Between releases the manifest holds the version of the last one. An
      # untagged version here means a previous run pushed its release commit
      # and then failed before publishing: raising on top of it would leave
      # that version in history having never shipped, so it wants a person
      # rather than a retry - publish the missing release, or reset the
      # manifest to the last tag.
      - name: Refuse to release unless main sits on the last released version
        run: |
          current="$(node -p "require('./manifest.json').version")"
          if ! git rev-parse -q --verify "refs/tags/$current" >/dev/null; then
            echo "manifest.json holds '$current', which is not tagged - main is not on a released version" >&2
            exit 1
          fi

      # Writes the raised version into manifest.json. Everything after this is
      # built from the tree it produced - the notes, the archive, the update
      # manifest - and the commit near the end is what gets tagged. Nothing
      # has left the runner yet, so the guard below still costs nothing.
      - name: Raise the version being released
        id: version
        run: |
          previous="$(node -p "require('./manifest.json').version")"
          version="$(node scripts/bump-version.mjs '${{ inputs.bump }}')"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version, a ${{ inputs.bump }} bump on $previous."

      - name: Refuse to release a version that is already tagged
        run: |
          version='${{ steps.version.outputs.version }}'
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag '$version' already exists - a '${{ inputs.bump }}' bump lands on a version that has been released" >&2
            exit 1
          fi

      # The release body is the whole changelog: there is no CHANGELOG.md, so
      # this is the only place a release is described.
      #
      # Empty output means every commit this cycle was an internal type, which
      # a cycle spent on tests, docs or a refactor legitimately is. It does not
      # stop the release: the step says why the body is blank and publishing
      # continues. That call belongs to whoever dispatched the workflow, who
      # read `pnpm changelog` first, rather than to a job already told to
      # publish - and the warnings are what make an empty body legible in the
      # log afterwards.
      - name: Build the release notes
        run: |
          pnpm exec git-cliff --config cliff.toml \
            --tag '${{ steps.version.outputs.version }}' \
            --unreleased --strip all --output /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "Nothing since the last release reaches the notes; every commit this cycle was an internal type." >&2
            echo "If something user-facing did land, it was committed under the wrong type." >&2
          fi

      - run: pnpm test

      - name: Build the archive
        id: package
        run: echo "xpi=$(pnpm run --silent package)" >> "$GITHUB_OUTPUT"

      # Reads the digest off the archive built in the previous step, so the
      # hash in the manifest is of the exact bytes being uploaded.
      - name: Build the update manifest
        id: updates
        run: |
          echo "json=$(node scripts/build-updates-json.mjs '${{ steps.package.outputs.xpi }}')" >> "$GITHUB_OUTPUT"

      # Before publishing, because the tag is created at this commit and
      # GitHub cannot tag one it does not have. It is also the last step that
      # can fail with nothing having shipped: everything above this line runs
      # against the runner's own copy.
      - name: Commit the released version
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Release ${{ steps.version.outputs.version }}" \
                     -m "A ${{ inputs.bump }} bump on ${{ steps.version.outputs.previous }}."
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          # The commit pushed above, not the one the run started from: that
          # one still holds the previous version in its manifest.
          target_commitish: ${{ steps.commit.outputs.sha }}
          files: |
            ${{ steps.package.outputs.xpi }}
            ${{ steps.updates.outputs.json }}
          body_path: /tmp/release-notes.md
          # Explicit because everything downstream depends on it: this is what
          # `releases/latest/download/updates.json` resolves to.
          make_latest: "true"
          draft: false
          prerelease: false
