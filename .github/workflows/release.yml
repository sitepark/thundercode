# Publishes a release and opens the next version. Run it by hand from the
# Actions tab; there is no automatic trigger.
#
# The version in manifest.json is what gets released — this workflow never
# chooses it. It tags that version, publishes it, and only then raises the
# manifest to the next one, so `main` always sits on an unreleased version and
# the tag always names a commit where the manifest agreed with it.
#
# Why the tag is created by the release rather than pushed first: a tag pushed
# with the default GITHUB_TOKEN does not trigger workflows, so a `on: push:
# tags:` job would never fire. Creating the tag as part of publishing avoids
# needing a personal access token to work around that.
#
# The release must not be a draft or a prerelease. `update_url` resolves
# through `releases/latest`, which skips both — either one would publish the
# archive while leaving every installed copy pointed at the previous version.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to raise for the next development version"
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

permissions:
  contents: write

# Two of these at once would race on the push to main and could publish two
# releases from the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the guard below asks git whether this version
      # has already been released, which a shallow clone cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the version being released
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to release from anywhere but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from main, got '$GITHUB_REF'" >&2
            exit 1
          fi

      - name: Refuse to release a version that is already tagged
        run: |
          version='${{ steps.version.outputs.version }}'
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag '$version' already exists — the manifest was not bumped after the last release" >&2
            exit 1
          fi

      - name: Refuse to release a version the changelog does not describe
        run: |
          version='${{ steps.version.outputs.version }}'
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi

      - run: pnpm test

      - name: Build the archive
        id: package
        run: echo "xpi=$(pnpm run --silent package)" >> "$GITHUB_OUTPUT"

      # Reads the digest off the archive built in the previous step, so the
      # hash in the manifest is of the exact bytes being uploaded.
      - name: Build the update manifest
        id: updates
        run: |
          echo "json=$(node scripts/build-updates-json.mjs '${{ steps.package.outputs.xpi }}')" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.package.outputs.xpi }}
            ${{ steps.updates.outputs.json }}
          generate_release_notes: true
          # Explicit because everything downstream depends on it: this is what
          # `releases/latest/download/updates.json` resolves to.
          make_latest: "true"
          draft: false
          prerelease: false

      # Last, deliberately. If anything above fails the manifest still holds
      # the version that failed to release, so a fixed re-run releases it
      # rather than skipping it.
      - name: Open the next version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          next="$(node scripts/bump-version.mjs '${{ inputs.bump }}')"
          git add manifest.json
          git commit -m "Open $next for development" \
                     -m "Released ${{ steps.version.outputs.version }}."
          git push origin HEAD:main
